apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkout-data
  namespace: shop
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-wider-access
  namespace: shop
subjects:
- kind: ServiceAccount
  name: remediation-agent
  namespace: agent-ops
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
